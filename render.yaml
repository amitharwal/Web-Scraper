# This file tells Render how to build and run the entire application.

services:
  # 1) Web (Flask/Gunicorn/SocketIO)
  - type: web
    name: auditor-pro-web
    env: python
    buildCommand: |
      apt-get update
      apt-get install -y libpango-1.0-0 libcairo2 libgdk-pixbuf2.0-0
      pip install -r requirements.txt
    startCommand: gunicorn --worker-class eventlet -w 1 --log-level=info --access-logfile - --error-logfile - run:app
    buildFilter:
      paths:
        - "auditor_pro/**"
        - "templates/**"
        - "static/**"
        - "*.py"
        - "requirements.txt"
        - "Procfile"
    envVars:
      - key: FLASK_APP
        value: run.py
      - key: FLASK_CONFIG
        value: production
      - key: FLASK_DEBUG
        value: "False"
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: DATABASE_URL
        fromDatabase:
          name: auditor-db            # Postgres is referenced via fromDatabase
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis                  # Redis is a service with type: redis
          name: auditor-redis
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: MAIL_SERVER
        value: smtp.googlemail.com
      - key: MAIL_PORT
        value: "587"
      - key: MAIL_USE_TLS
        value: "true"
      - key: MAIL_USERNAME
        sync: false
      - key: MAIL_PASSWORD
        sync: false
      - key: MAIL_DEFAULT_SENDER
        sync: false

  # 2) Celery Worker
  - type: worker
    name: auditor-pro-worker
    env: python
    buildCommand: |
      apt-get update
      apt-get install -y ca-certificates curl gnupg
      curl -fsSL https://deb.nodesource.com/setup_18.x | bash -
      apt-get install -y nodejs libpango-1.0-0 libcairo2 libgdk-pixbuf2.0-0
      pip install -r requirements.txt
      npm install -g lighthouse
    startCommand: celery -A celery_worker.celery worker --loglevel=info
    buildFilter:
      paths:
        - "auditor_pro/**"
        - "templates/**"
        - "static/**"
        - "*.py"
        - "requirements.txt"
        - "Procfile"
    envVars:
      - key: FLASK_CONFIG
        value: production
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: DATABASE_URL
        fromDatabase:
          name: auditor-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: auditor-redis
          property: connectionString
      - key: NODE_VERSION
        value: "18"
      - key: SECRET_KEY
        generateValue: true
      - key: MAIL_SERVER
        value: smtp.googlemail.com
      - key: MAIL_PORT
        value: "587"
      - key: MAIL_USE_TLS
        value: "true"
      - key: MAIL_USERNAME
        sync: false
      - key: MAIL_PASSWORD
        sync: false
      - key: MAIL_DEFAULT_SENDER
        sync: false

  # 3) Celery Beat
  - type: worker
    name: auditor-pro-beat
    env: python
    buildCommand: |
      apt-get update
      apt-get install -y libpango-1.0-0 libcairo2 libgdk-pixbuf2.0-0
      pip install -r requirements.txt
    startCommand: celery -A celery_worker.celery beat --loglevel=info
    buildFilter:
      paths:
        - "auditor_pro/**"
        - "templates/**"
        - "static/**"
        - "*.py"
        - "requirements.txt"
        - "Procfile"
    envVars:
      - key: FLASK_CONFIG
        value: production
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: DATABASE_URL
        fromDatabase:
          name: auditor-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: auditor-redis
          property: connectionString
      - key: SECRET_KEY
        generateValue: true

  # 4) Managed Redis (belongs under services, not databases)
  - type: redis
    name: auditor-redis
    plan: free
    ipAllowList: []          # optional: allow all service-to-service access

databases:
  # Managed Postgres belongs under databases
  - name: auditor-db
    databaseName: auditor_db
    plan: free